name: Apply cockpit workflow transitions

on:
  push:
    branches:
      - feat/cockpit-workflow-transitions
    paths:
      - .github/workflows/apply-cockpit-workflow-transitions.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/cockpit-workflow-transitions

      - name: Apply init.org patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/init.patch
          git apply --check /tmp/init.patch
          git apply /tmp/init.patch
          rm .github/workflows/apply-cockpit-workflow-transitions.yml

      - name: Validate structure
        shell: python
        run: |
          from pathlib import Path

          text = Path('init.org').read_text(encoding='utf-8')

          required = (
              '(defun my/org-change-workflow-state ()',
              '(defun my/org-agenda-change-workflow-state ()',
              '"C-c C-t"',
              '("t" . my/org-agenda-change-workflow-state)',
              '"DOING" \'("次の一手")',
              '"HOLD" \'("再開時の一手" "中断理由")',
              '"WAIT" \'("待っているもの" "次に確認する時点" "解除後の一手")',
          )
          for value in required:
              if value not in text:
                  raise RuntimeError(f'required code missing: {value}')

          forbidden = (
              'my/org-agenda-workflow-lanes',
              'my/org-agenda-move-workflow-up',
              'my/org-agenda-move-workflow-down',
              '("s-<up>" . my/org-agenda-move-workflow-up)',
              '("s-<down>" . my/org-agenda-move-workflow-down)',
          )
          for value in forbidden:
              if value in text:
                  raise RuntimeError(f'obsolete lane code remains: {value}')

          begin_count = text.count('#+begin_src emacs-lisp')
          end_count = text.count('#+end_src')
          if begin_count != end_count:
              raise RuntimeError(
                  f'Org source block mismatch: {begin_count} begin / {end_count} end'
              )

          workflow = Path('.github/workflows/apply-cockpit-workflow-transitions.yml')
          if workflow.exists():
              raise RuntimeError('temporary workflow was not removed')

      - name: Install Emacs
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq emacs-nox

      - name: Tangle and parse generated Emacs Lisp
        shell: bash
        run: |
          emacs --batch -Q \
            --eval "(require 'org)" \
            --eval "(require 'ob-tangle)" \
            --eval "(org-babel-tangle-file \"init.org\" nil \"emacs-lisp\")"
          emacs --batch -Q \
            --eval "(with-temp-buffer (insert-file-contents \"init.el\") (goto-char (point-min)) (condition-case nil (while t (read (current-buffer))) (end-of-file t)))"
          emacs --batch -Q \
            --eval "(with-temp-buffer (insert-file-contents \"early-init.el\") (goto-char (point-min)) (condition-case nil (while t (read (current-buffer))) (end-of-file t)))"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add init.org .github/workflows/apply-cockpit-workflow-transitions.yml
          git diff --cached --check
          git commit -m "コックピットの状態遷移操作を整理"
          git push origin HEAD:feat/cockpit-workflow-transitions
